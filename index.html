<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2457a7"><link rel="manifest" href="manifest.webmanifest"><title>My English Coach</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#202938;font:16px/1.5 system-ui,Arial}header{background:#2457a7;color:white;padding:20px}main{max-width:850px;margin:auto;padding:14px}button{background:#2457a7;color:white;border:0;border-radius:8px;padding:10px 13px;font:inherit;cursor:pointer}.secondary{background:#e8edf6;color:#202938}.panel,.lesson,.stat{background:white;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0000000c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat strong{display:block;font-size:1.3rem;color:#2457a7}nav{display:flex;gap:6px;overflow:auto;padding:8px 0}.tab{white-space:nowrap}.active{background:#173d7b}h1,h2,h3{line-height:1.25}.tag{background:#edf3ff;color:#2457a7;border-radius:18px;padding:3px 8px;font-size:.85rem}.muted{color:#667085;font-size:.92rem}.question{padding:12px 0;border-bottom:1px solid #edf0f5}.options label{display:block;margin:7px 0}.feedback{padding:10px;border-radius:8px;margin-top:8px}.good{background:#e5f7ec;color:#145b36}.bad{background:#fff0ee;color:#912018}.pill{padding:8px;background:#f0f3f8;border-radius:8px;margin:6px 0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}textarea,input[type=file]{width:100%;padding:10px}textarea{min-height:100px;border:1px solid #ccd3df;border-radius:8px}.hidden{display:none}@media(max-width:450px){.stats{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><h1>📘 My English Coach</h1><div>Il tuo percorso gratuito di inglese: A1 → A2</div></header><main><div class="stats"><div class="stat">Punti<strong id="points">0</strong></div><div class="stat">Lezioni superate<strong id="passed">0</strong></div><div class="stat">Giorni di studio<strong id="streak">0</strong></div></div><nav id="nav"></nav><section id="app"></section><p class="muted">Progressi salvati su questo dispositivo. Esporta un backup per conservarli.</p></main><script>
const L=[
[1,"A1","Il verbo TO BE","Dire chi sei e come stai.","I am = io sono; you are = tu sei; he/she/it is = lui/lei è; we are = noi siamo; they are = loro sono. Forme brevi: I'm, you're, he's, she's.","hello|ciao;happy|felice;tired|stanco/a",["I ___ Marco.",["am","is","are"],0,"Con I si usa am."],["She ___ happy.",["am","are","is"],2,"Con she si usa is."],["«Sono stanco».",["I am tired.","I tired am.","I is tired."],0,"La struttura è soggetto + am + aggettivo."]],
[2,"A1","TO BE: negativa e domanda","Negare e fare domande.","Negativa: I am not, you are not, he is not. Domande: Are you...? Is she...? Risposte: Yes, I am. / No, I'm not.","ready|pronto/a;busy|impegnato/a;at home|a casa",["___ you ready?",["Am","Are","Is"],1,"Con you si usa Are."],["He ___ at home.",["isn't","aren't","don't"],0,"Con he si usa isn't."],["Risposta negativa a «Are you busy?»",["No, I am not.","No, you aren't.","No, I don't."],0,"Risposta breve: No, I am not."]],
[3,"A1","Ordine delle parole","Costruire frasi semplici.","Ordine tipico: soggetto + verbo + complemento. Esempio: I play tennis. L'aggettivo di solito precede il nome: a big house.","house|casa;small|piccolo/a;today|oggi",["Scegli la frase corretta.",["I coffee like.","I like coffee.","Like I coffee."],1,"Soggetto + verbo + complemento."],["«Una casa grande»",["a house big","big a house","a big house"],2,"L'aggettivo precede il nome."],["«Oggi lavoro»",["I work today.","Today work I.","I today working."],0,"La frase corretta è I work today."]],
[4,"A1","Present simple","Parlare di abitudini.","I/you/we/they + verbo base: I work. He/she/it + -s: she works. Negativa: don't/doesn't + verbo base. Domande: Do you...? Does she...?","work|lavorare;play|giocare;usually|di solito;weekend|fine settimana",["He ___ football.",["play","plays","playing"],1,"Alla terza persona singolare si aggiunge -s."],["I ___ like mushrooms.",["doesn't","don't","am not"],1,"Con I si usa don't."],["___ she work here?",["Do","Does","Is"],1,"Con she si usa Does."]],
[5,"A1","Domande personali","Chiedere informazioni di base.","What is your name? How old are you? Where do you live? What do you do? Risposte: My name is… / I'm … years old / I live in…","name|nome;live|abitare;age|età;where|dove",["«Dove abiti?»",["Where do you live?","Where you live?","Where are live you?"],0,"Where + do + soggetto + verbo."],["«Ho 37 anni»",["I have 37 years.","I am 37 years old.","I am 37 year."],1,"L'età si esprime con to be."],["«Mi chiamo Marco»",["I call Marco.","My name is Marco.","I am name Marco."],1,"La forma naturale è My name is Marco."]],
[6,"A1","Articoli e plurali","Usare a, an, the e i plurali.","A davanti a suono consonantico: a book. An davanti a suono vocalico: an apple. Plurale regolare +s: books. Irregolare: child/children.","book|libro;apple|mela;children|bambini;people|persone",["___ apple",["a","an","the"],1,"An apple: apple inizia con suono vocalico."],["Plurale di book",["bookes","books","bookies"],1,"Il plurale regolare aggiunge -s."],["Plurale di child",["childs","childes","children"],2,"Children è irregolare."]],
[7,"A1","CAN e CAN'T","Parlare di capacità.","Can + verbo base: I can swim. Negativa: can't. Domanda: Can you swim? Non aggiungere -s dopo can.","swim|nuotare;drive|guidare;speak|parlare;run|correre",["She ___ speak English.",["can","cans","is can"],0,"Dopo can il verbo resta alla forma base."],["«Non so nuotare»",["I don't can swim.","I can't swim.","I am not swim."],1,"Si usa can't + verbo base."],["Domanda corretta",["You can drive?","Can you drive?","Do can you drive?"],1,"Can precede il soggetto nella domanda."]],
[8,"A1","THERE IS / THERE ARE","Descrivere luoghi e oggetti.","There is + singolare. There are + plurale. In = dentro; on = sopra; under = sotto; next to = accanto a.","shop|negozio;near|vicino;under|sotto;next to|accanto a",["___ a book on the table.",["There are","There is","It are"],1,"Book è singolare: There is."],["___ two parks.",["There is","There are","It is"],1,"Parks è plurale: There are."],["«Il gatto è sotto il tavolo»",["The cat is under the table.","The cat under is table.","The cat is the table under."],0,"Under significa sotto."]],
[9,"A2","Past simple di TO BE","Parlare del passato con was e were.","I/he/she/it was; you/we/they were. Negativa: wasn't/weren't. Domanda: Was she...? Were they...?","yesterday|ieri;last week|la settimana scorsa;was|ero/era;were|eri/eravamo/erano",["Yesterday I ___ tired.",["were","was","am"],1,"Con I al passato si usa was."],["They ___ at home yesterday.",["was","are","were"],2,"Con they si usa were."],["Negativa corretta",["She weren't here.","She wasn't here.","She didn't was here."],1,"Con she si usa wasn't."]],
[10,"A2","Comparativi","Confrontare persone e cose.","Aggettivi brevi: tall → taller than. Aggettivi lunghi: more interesting than. Irregolari: good → better; bad → worse.","tall|alto/a;faster|più veloce;better|migliore;than|di/rispetto a",["A car is ___ than a bike.",["fast","faster","more fast"],1,"Fast è breve: faster."],["This is ___ than before.",["gooder","more good","better"],2,"Good ha comparativo irregolare better."],["«Più interessante di»",["interestinger than","more interesting than","most interesting than"],1,"Si usa more + aggettivo + than."]]
];
const defaults=()=>({points:0,passed:[],attempts:{},mistakes:[],vocab:[],notes:"",lastDay:"",streak:0,placement:null});
let S;try{S=JSON.parse(localStorage.getItem("mec_v2"))||defaults()}catch(e){S=defaults()}let tab="home",lessonId=1;
const tabs=[["home","Lezioni"],["vocab","Parole"],["grammar","Grammatica"],["errors","Errori"],["test","Test iniziale"],["notes","Appunti"],["backup","Backup"]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("mec_v2",JSON.stringify(S));stats()}
function stats(){document.getElementById("points").textContent=S.points;document.getElementById("passed").textContent=S.passed.length;document.getElementById("streak").textContent=S.streak}
function render(){document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="tab ${tab===t[0]?"active":""}" data-tab="${t[0]}">${t[1]}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let a=document.getElementById("app");if(tab==="home")a.innerHTML=`<div class="panel"><h2>Benvenuto!</h2><p>Leggi la regola, completa gli esercizi e leggi le spiegazioni. Una lezione è superata con almeno il 70%.</p><p>Consiglio: una lezione alla volta, ripetendo le parole ad alta voce.</p></div><div class="cols">${L.map(l=>`<div class="lesson"><span class="tag">${l[1]}</span><h3>${l[0]}. ${l[2]}</h3><p>${l[3]}</p><p class="muted">${S.passed.includes(l[0])?"✅ Superata":S.attempts[l[0]]?"Tentativi: "+S.attempts[l[0]]:"Da iniziare"}</p><button data-open="${l[0]}">Apri lezione</button></div>`).join("")}</div>`;
else if(tab==="lesson")a.innerHTML=lessonPage();
else if(tab==="vocab")a.innerHTML=`<div class="panel"><h2>Archivio parole</h2>${S.vocab.length?S.vocab.map((v,i)=>`<div class="pill"><b>${esc(v.en)}</b> — ${esc(v.it)} <button class="secondary" data-remove="${i}">Rimuovi</button></div>`).join("")+`<button id="flash">Modalità ripasso</button><div id="flashout"></div>`:"<p>Apri una lezione e premi Aggiungi per salvare parole.</p>"}</div>`;
else if(tab==="grammar")a.innerHTML=`<div class="panel"><h2>Grammatica rapida</h2>${L.map(l=>`<div class="lesson"><span class="tag">${l[1]}</span><h3>${l[2]}</h3><p>${l[4]}</p></div>`).join("")}</div>`;
else if(tab==="errors")a.innerHTML=`<div class="panel"><h2>Registro degli errori</h2>${S.mistakes.length?S.mistakes.slice().reverse().map(m=>`<div class="lesson"><b>${esc(m.lesson)}</b><p>${esc(m.question)}</p><p>La tua risposta: ${esc(m.chosen)}</p><p>Risposta corretta: ${esc(m.correct)}</p><p class="muted">${esc(m.why)}</p></div>`).join(""):"<p>Nessun errore registrato per ora.</p>"}<button id="clearerrors" class="secondary">Svuota registro</button></div>`;
else if(tab==="test")a.innerHTML=testPage();
else if(tab==="notes")a.innerHTML=`<div class="panel"><h2>I miei appunti</h2><textarea id="notes">${esc(S.notes)}</textarea><p><button id="savenotes">Salva appunti</button></p></div>`;
else a.innerHTML=`<div class="panel"><h2>Backup dei progressi</h2><p>Esporta un file JSON per conservare punti, lezioni, parole ed appunti.</p><button id="export">Esporta backup</button><label>Importa backup JSON<input type="file" id="importfile" accept=".json,application/json"></label><p id="backupmsg" class="muted"></p><p class="muted">App gratuita, senza account o servizi a pagamento.</p></div>`;
stats();bind()}
function lessonPage(){let l=L.find(x=>x[0]===lessonId);return `<div class="panel"><button class="secondary" id="back">← Tutte le lezioni</button><p><span class="tag">${l[1]}</span></p><h2>${l[0]}. ${l[2]}</h2><p>${l[3]}</p><h3>📚 Spiegazione</h3><p>${l[4]}</p><h3>🧠 Esercizi</h3><form id="quiz">${l.slice(6).map((q,i)=>`<div class="question"><p><b>${i+1}. ${q[0]}</b></p>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}<div id="f${i}"></div></div>`).join("")}<p><button>Correggi esercizi</button></p></form><div id="result"></div><h3>🗂 Parole della lezione</h3>${l[5].split(";").map(v=>{let [en,it]=v.split("|");return `<div class="pill"><b>${en}</b> — ${it} <button class="secondary" data-add="${esc(en)}" data-it="${esc(it)}">Aggiungi</button></div>`}).join("")}</div>`}
function testPage(){let Q=[["I ___ Italian.",["am","is","are"],0],["She ___ coffee every morning.",["drink","drinks","drinking"],1],["___ you play tennis?",["Does","Do","Are"],1],["There ___ two shops.",["is","are","be"],1],["Yesterday they ___ tired.",["was","were","are"],1],["This book is ___ than that one.",["interesting","more interesting","most interesting"],1]];return `<div class="panel"><h2>Test iniziale</h2><p>È un orientamento, non un esame.</p><form id="placement">${Q.map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="p${i}" value="${j}"> ${o}</label>`).join("")}</div>`).join("")}<button>Calcola risultato</button></form><div id="pr"></div></div>`}
function bind(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{lessonId=Number(b.dataset.open);tab="lesson";render()});let back=document.getElementById("back");if(back)back.onclick=()=>{tab="home";render()};
let qf=document.getElementById("quiz");if(qf)qf.onsubmit=e=>{e.preventDefault();let l=L.find(x=>x[0]===lessonId),score=0; l.slice(6).forEach((q,i)=>{let sel=qf.querySelector(`input[name="q${i}"]:checked`),n=sel?Number(sel.value):-1,ok=n===q[2];if(ok)score++;else S.mistakes.push({lesson:l[2],question:q[0],chosen:n<0?"Nessuna risposta":q[1][n],correct:q[1][q[2]],why:q[3]});document.getElementById("f"+i).innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"Corretto!":"Da rivedere."} ${esc(q[3])}</div>`});let pct=Math.round(score/3*100);S.attempts[l[0]]=(S.attempts[l[0]]||0)+1;S.points+=score*2;if(pct>=70&&!S.passed.includes(l[0])){S.passed.push(l[0]);S.points+=20}let today=new Date().toISOString().slice(0,10);if(S.lastDay!==today){S.streak=S.lastDay===new Date(Date.now()-86400000).toISOString().slice(0,10)?S.streak+1:1;S.lastDay=today}save();document.getElementById("result").innerHTML=`<div class="feedback ${pct>=70?"good":"bad"}"><b>Risultato: ${score}/3 (${pct}%).</b><br>${pct>=70?"Lezione superata! Ottimo lavoro.":"Rileggi la regola e riprova."}</div>`};
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(!S.vocab.some(v=>v.en.toLowerCase()===b.dataset.add.toLowerCase()))S.vocab.push({en:b.dataset.add,it:b.dataset.it});save();b.textContent="Aggiunta ✓";b.disabled=true});
document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{S.vocab.splice(Number(b.dataset.remove),1);save();render()});
let flash=document.getElementById("flash");if(flash)flash.onclick=()=>{let i=0,out=document.getElementById("flashout");function show(){if(i>=S.vocab.length){out.textContent="Ripasso completato!";return}let v=S.vocab[i];out.innerHTML=`<div class="lesson"><h3>${esc(v.en)}</h3><button id="reveal">Mostra traduzione</button><span id="trans"></span> <button class="secondary" id="next">Prossima</button></div>`;document.getElementById("reveal").onclick=()=>document.getElementById("trans").textContent=" — "+v.it;document.getElementById("next").onclick=()=>{i++;show()}}show()};
let ce=document.getElementById("clearerrors");if(ce)ce.onclick=()=>{S.mistakes=[];save();render()};
let sn=document.getElementById("savenotes");if(sn)sn.onclick=()=>{S.notes=document.getElementById("notes").value;save();sn.textContent="Salvato ✓"};
let ex=document.getElementById("export");if(ex)ex.onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="my-english-coach-backup.json";a.click();URL.revokeObjectURL(u)};
let im=document.getElementById("importfile");if(im)im.onchange=async()=>{try{let d=JSON.parse(await im.files[0].text());if(!Array.isArray(d.passed)||typeof d.points!=="number")throw 0;S={...defaults(),...d};save();document.getElementById("backupmsg").textContent="Backup importato.";render()}catch(e){document.getElementById("backupmsg").textContent="File non valido: scegli un backup JSON esportato dall'app."}};
let pf=document.getElementById("placement");if(pf)pf.onsubmit=e=>{e.preventDefault();let key=[0,1,1,1,1,1],s=0;key.forEach((n,i)=>{let x=pf.querySelector(`input[name="p${i}"]:checked`);if(x&&Number(x.value)===n)s++});S.placement={score:s,total:6};save();document.getElementById("pr").innerHTML=`<div class="feedback good">Risposte corrette: ${s}/6. ${s<=2?"Inizia da A1.":s<=4?"Rivedi A1 e poi prova A2.":"Hai già alcune basi: consolida A1 e prova A2 quando ti senti pronto."}</div>`}
}
render();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script></body></html>
